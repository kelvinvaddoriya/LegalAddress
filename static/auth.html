<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LegalAddress — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<style>
  :root, [data-theme="light"] {
    --bg:#f3e9d2; --bg2:#efe3c7; --card:#fbf4e1; --line:#ddccab;
    --fg:#2f2a20; --muted:#7c6f57; --accent:#8a3324; --accent-soft:rgba(138,51,36,.10);
    --shadow:rgba(74,57,28,.14); --err:#c0392b;
  }
  [data-theme="dark"] {
    --bg:#1b1712; --bg2:#211c15; --card:#262019; --line:#3a3024;
    --fg:#ece0c9; --muted:#a8967a; --accent:#d98e5a; --accent-soft:rgba(217,142,90,.12);
    --shadow:rgba(0,0,0,.35); --err:#ff9b8b;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font:18px/1.7 "Spectral", Georgia, "Times New Roman", serif;
    background:var(--bg); color:var(--fg);
    background-image:
      radial-gradient(120% 80% at 50% -10%, var(--bg2), transparent 60%),
      radial-gradient(140% 120% at 50% 120%, var(--accent-soft), transparent 55%);
    background-attachment:fixed; padding:22px;
  }
  .card {
    width:100%; max-width:400px; background:var(--card);
    border:1px solid var(--line); border-radius:6px;
    padding:34px 34px 30px; box-shadow:0 2px 24px var(--shadow);
  }
  h1 {
    font-family:"Fraunces", Georgia, serif; font-optical-sizing:auto;
    font-weight:600; font-size:28px; margin:0; line-height:1;
  }
  h1 .amp { color:var(--accent); }
  .sub { color:var(--muted); font-size:14px; font-style:italic; margin:8px 0 24px; }
  label { display:block; font-size:13px; color:var(--muted); letter-spacing:.04em; margin:14px 0 5px; }
  input {
    width:100%; padding:12px 14px; border-radius:4px; border:1px solid var(--line);
    background:var(--bg); color:var(--fg); font:inherit; font-size:16px;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  button.primary {
    width:100%; margin-top:22px; cursor:pointer; border:0;
    background:var(--accent); color:#fbf4e1; padding:13px; border-radius:4px;
    font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:16px; letter-spacing:.02em;
    transition:filter .2s ease, transform .05s ease;
  }
  button.primary:hover { filter:brightness(1.06); }
  button.primary:active { transform:translateY(1px); }
  button.primary:disabled { opacity:.5; cursor:default; }
  .toggle { margin-top:18px; font-size:14px; color:var(--muted); text-align:center; }
  .toggle a { color:var(--accent); cursor:pointer; text-decoration:none; border-bottom:1px solid var(--accent-soft); }
  .toggle a:hover { border-bottom-color:var(--accent); }
  .msg { margin-top:16px; font-size:14px; font-style:italic; min-height:1em; }
  .msg.err { color:var(--err); }
  #codeField { display:none; }
</style>
</head>
<body>
<div class="card">
  <h1>Legal<span class="amp">·</span>Address</h1>
  <div class="sub" id="sub">Sign in to continue</div>

  <form id="form" autocomplete="on">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required />

    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required minlength="8" />

    <div id="codeField">
      <label for="code">Invite code</label>
      <input id="code" type="text" autocomplete="off" />
    </div>

    <button class="primary" id="submit" type="submit">Sign in</button>
  </form>

  <div class="msg" id="msg"></div>
  <div class="toggle" id="toggle">
    New here? <a id="switch">Create an account</a>
  </div>
</div>

<script>
  // Match the main page's persisted theme.
  (function () {
    let saved;
    try { saved = localStorage.getItem("la-theme"); } catch (e) {}
    document.documentElement.setAttribute("data-theme", saved || "light");
  })();

  let mode = "login";  // or "signup"
  const els = {
    sub: document.getElementById("sub"),
    pw: document.getElementById("password"),
    submit: document.getElementById("submit"),
    msg: document.getElementById("msg"),
    toggle: document.getElementById("toggle"),
    code: document.getElementById("codeField"),
    form: document.getElementById("form"),
  };

  function setMode(next) {
    mode = next;
    const signup = mode === "signup";
    els.sub.textContent = signup ? "Create your account" : "Sign in to continue";
    els.submit.textContent = signup ? "Create account" : "Sign in";
    els.pw.setAttribute("autocomplete", signup ? "new-password" : "current-password");
    els.code.style.display = signup ? "block" : "none";
    els.toggle.innerHTML = signup
      ? 'Already have an account? <a id="switch">Sign in</a>'
      : 'New here? <a id="switch">Create an account</a>';
    document.getElementById("switch").onclick = () => setMode(signup ? "login" : "signup");
    els.msg.textContent = "";
    els.msg.className = "msg";
  }
  document.getElementById("switch").onclick = () => setMode("signup");

  els.form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = els.pw.value;
    const code = document.getElementById("code").value;
    els.msg.textContent = "";
    els.msg.className = "msg";
    els.submit.disabled = true;

    const path = mode === "signup" ? "/auth/signup" : "/auth/login";
    const body = mode === "signup" ? { email, password, code } : { email, password };
    try {
      const r = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (r.ok) {
        window.location.href = "/";
        return;
      }
      const d = await r.json().catch(() => ({ error: "Request failed (" + r.status + ")" }));
      els.msg.textContent = d.error || "Something went wrong.";
      els.msg.className = "msg err";
    } catch (err) {
      els.msg.textContent = String(err);
      els.msg.className = "msg err";
    } finally {
      els.submit.disabled = false;
    }
  });
</script>
</body>
</html>
